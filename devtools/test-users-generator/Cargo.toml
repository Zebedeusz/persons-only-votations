[package]
name = "test-users-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.0", features = ["derive"] }
subxt = { version = "0.42.1" }
subxt-signer = { version = "0.42.1" }
tokio = { version = "1", features = ["full"] }
verifiable = { version = "0.2.0", features = ["small-ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scale-info = "2.11"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
num-bigint = "0.4"

[[bin]]
name = "generate-test-users"
path = "src/main.rs"
