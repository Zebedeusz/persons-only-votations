[package]
name = "persons-only-votations"
version = "0.1.0"
edition = "2024"

[dependencies]
subxt = { version = "0.37", features = ["substrate-compat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
blake2 = "0.10"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"
sp-core = "31.0"
sp-runtime = "34.0"
scale-codec = { package = "parity-scale-codec", version = "3.0", features = ["derive"] }
scale-info = { version = "2.0", features = ["derive"] }

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
async-trait = "0.1"
