[package]
name = "persons-only-votations"
version = "3.1.0"
edition = "2024"

[dependencies]
subxt = { version = "0.37", features = ["substrate-compat"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
blake2 = "0.10"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"
sp-runtime = "34.0"
scale-codec = { package = "parity-scale-codec", version = "3.0", features = ["derive"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4.0", features = ["derive", "env"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fastrand = "2.0"
verifiable = { version = "0.2.0", features = ["small-ring", "std"] }
rand = { version = "0.8", features = ["std"] }
tfhe = { version = "0.5", features = ["boolean", "shortint", "seeder_unix"] }
bincode = "1.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
